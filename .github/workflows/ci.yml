name: CI

# 触发面：
#   - push main：规范检查 + Debug 编译 + JVM 单元测试（不发版，也不更新官网）
#   - pull_request → main：同上；纯文档变更跳过（paths-ignore）
#   - push tag v*：额外进入 release job，并在 release 成功后部署官网（deploy-site）
#   - schedule：每周完整 UI 矩阵（圆屏/方屏手表 + 小屏/标准手机），不阻断发版
#   - workflow_dispatch：手动跑完整 CI；可选 ui_devices 只跑指定 UI 设备
#
# 权限最小化：workflow 默认只读；发布需要的 contents: write 只挂在 tag 专用的 release job 上。
# 普通 PR/main push 不接触任何 secrets，也不执行 Release 发布 / 官网部署。
# 官网只在 tag 发版时由 Netlify CLI 部署（netlify.toml 已跳过普通 push 的自动构建）。

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
    # PR 只跳过纯文档变更；push/tag 不加 paths 过滤，避免影响发版判断
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'site/**'
  schedule:
    # 每周日 18:00 UTC（周一 02:00 Asia/Shanghai）跑完整 4 设备矩阵
    - cron: '0 18 * * 0'
  workflow_dispatch:
    inputs:
      ui_devices:
        description: 'UI 冒烟设备（all 或逗号分隔）'
        required: false
        default: all
        type: choice
        options: [all, round-watch, small-phone, standard-phone, square-watch]

permissions:
  contents: read

concurrency:
  # 定时完整矩阵使用独立 group，避免被普通 main push 取消
  group: ci-${{ github.ref }}-${{ github.event_name == 'schedule' && 'weekly' || 'normal' }}
  # tag 发布、每周定时任务不取消；分支/PR 连推时取消旧任务
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'schedule' }}

jobs:
  # Job A：仓库规范 + 测试体系不变量 + CI 配置静态检查。
  # 不编译，因此几分钟内就能拦住文档链接失效、凭据误入库、Audio Focus 设计被破坏等问题。
  checks:
    name: 规范与环境检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17（含 Gradle 缓存）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: 准备 Android SDK（环境检查需要 ANDROID_HOME/platform 33）
        run: ./scripts/ci-prepare-sdk.sh

      - name: 环境与仓库自检（6 个只读脚本）
        run: |
          set -o pipefail
          ./scripts/check-env.sh
          ./scripts/check-repo.sh
          ./scripts/check-links.sh
          ./scripts/validate-ci.sh
          ./scripts/check-tests.sh

  # Job B：Debug 编译。编译失败必须让 job 失败；产物与日志用于定位。
  build:
    name: 编译自检（Debug）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17（含 Gradle 缓存）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: 准备 Android SDK（platform 33 / build-tools）
        run: ./scripts/ci-prepare-sdk.sh

      # 此时没有任何 secrets：debug 包不含凭据（发布 job 才注入）
      - name: 编译 Debug 包 + UI 测试 APK
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: 上传 Debug 包与 UI 测试 APK
        uses: actions/upload-artifact@v4
        with:
          name: Re-BiliTerminal-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  # Job C：JVM 单元测试（JUnit4 + Robolectric，无需模拟器）。
  # 与 build 并行：编译失败与测试失败在界面上是两条独立结果，便于区分原因。
  unit-test:
    name: JVM 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17（含 Gradle 缓存）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: 准备 Android SDK（platform 33 / build-tools）
        run: ./scripts/ci-prepare-sdk.sh

      # Gradle 的退出码决定 job 成败：测试失败/编译失败都会让本 job 红。
      # 不加 continue-on-error，避免把核心测试失败伪装成通过。
      - name: 执行 JVM 单元测试
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # 报告步骤始终执行：即使 Gradle 失败也要把「哪些用例失败/为什么」放进日志与 Summary。
      # 没有 TEST-*.xml 时脚本以退出码 2 明确标记 NOT RUN（编译/环境问题）。
      - name: 汇总测试结果（日志 + GitHub Step Summary）
        if: always()
        run: python3 scripts/summarize-tests.py app/build/test-results/testDebugUnitTest

      - name: 上传测试报告（XML + HTML）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  # Job D0：按事件生成 UI 设备矩阵。PR 只跑圆屏手表+小屏手机；main 跑标准手机+方屏手表；
  # schedule / workflow_dispatch 跑完整矩阵；tag 为空（发版链不跑 UI）。
  ui-prepare:
    name: 生成 UI 设备矩阵
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_ui: ${{ steps.matrix.outputs.has_ui }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 生成矩阵
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          UI_DEVICES: ${{ inputs.ui_devices }}
        run: python3 scripts/ui/prepare-matrix.py

  # Job D1：云端多屏幕 UI 冒烟。每次 job 独占一个 runner + 一个 AVD，不与其他 job 争抢。
  # 失败/成功都上传报告；不进入 release 的 needs，不阻断正式发版（稳定后再评估门禁）。
  ui-smoke:
    name: UI 冒烟（${{ matrix.label }}）
    needs: [build, ui-prepare]
    if: ${{ needs.ui-prepare.outputs.has_ui == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ui-prepare.outputs.matrix) }}
    env:
      UI_DEVICE_ID: ${{ matrix.id }}
      UI_LABEL: ${{ matrix.label }}
      UI_API: ${{ matrix.api }}
      UI_TARGET: ${{ matrix.target }}
      UI_ARCH: ${{ matrix.arch }}
      UI_PROFILE: ${{ matrix.profile }}
      UI_AVD: ${{ matrix.avd }}
      UI_ROUND: ${{ matrix.round }}
      UI_SHAPE: ${{ matrix.shape }}
      UI_APK_DIR: ui-apk
      UI_REPORT_DIR: ui-report
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载已构建 APK（app + androidTest）
        uses: actions/download-artifact@v4
        with:
          name: Re-BiliTerminal-debug
          path: ui-apk

      - name: 安装视觉差异依赖（失败时 diff 报告标记 SKIP，不隐藏测试失败）
        run: python3 -m pip install --quiet pillow || echo 'pillow install failed; visual diff will be skipped' 

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 启动 AVD 并执行 UI 冒烟
        id: emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          avd-name: ${{ matrix.avd }}
          force-avd-creation: true
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -no-snapshot -camera-back none -camera-front none
          script: bash scripts/ui/run-on-device.sh

      - name: 补写基础设施失败报告
        if: always()
        run: |
          mkdir -p ui-report
          if [ ! -f ui-report/status.json ]; then
            printf '%s\n' '模拟器/设备未完成启动或测试未执行；见 Actions 日志与 ui-report 中的 stages/cold-start。' > ui-report/infra-failure.txt
            python3 scripts/ui/make-report.py --report-dir ui-report --device-id "$UI_DEVICE_ID"               --label "$UI_LABEL" --api "$UI_API" --commit "$GITHUB_SHA"               --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"               --instrumentation-exit 999 || true
          fi
          if [ -f ui-report/job-summary.md ]; then
            cat ui-report/job-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## UI 冒烟 · $UI_LABEL ($UI_DEVICE_ID) — INFRA_FAILED（无报告）" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 上传 UI 测试报告与截图（始终）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-report-${{ matrix.id }}-api${{ matrix.api }}-${{ github.run_number }}
          path: ui-report/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: 发布（tag）
    # 只有 tag 推送才进入发布链；普通 PR / main push 永远不会拿到写权限与 secrets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, checks, unit-test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17（含 Gradle 缓存）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: 准备 Android SDK（platform 33 / build-tools）
        run: ./scripts/ci-prepare-sdk.sh

      # P0 发版门禁：tag/versionCode/签名任一不满足就不进入构建，避免错版/未签名发布。
      # 同 tag 补发跳过 versionCode 递增；历史 -fix/fix1 tag 在 check-release.sh 内白名单放行。
      - name: 发版前置校验（tag / versionCode / 签名配置）
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          # 只用于「是否存在」判断，脚本不会输出 secret 值
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASSWORD: ${{ secrets.ALIAS_PASSWORD }}
        run: |
          set -Eeuo pipefail
          VERSION_NAME=$(grep -m1 -E '^[[:space:]]*versionName[[:space:]]' app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -m1 -E '^[[:space:]]*versionCode[[:space:]]' app/build.gradle | grep -oE '[0-9]+' | head -1)
          PREVIOUS_VERSION_CODE=""
          # 已存在同 tag 的 Release：视为补发，允许沿用 versionCode；新 tag 必须递增。
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "已存在 $TAG 的 Release，按同 tag 补发处理：跳过 versionCode 递增校验"
          else
            LATEST_TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name // empty' 2>/dev/null || true)
            if [ -n "$LATEST_TAG" ]; then
              TMPDIR=$(mktemp -d)
              trap 'rm -rf "$TMPDIR"' EXIT
              if gh release download "$LATEST_TAG" --pattern update.json --dir "$TMPDIR" --clobber -R "$GITHUB_REPOSITORY" 2>/dev/null; then
                PREVIOUS_VERSION_CODE=$(jq -r '.versionCode // empty' "$TMPDIR/update.json" 2>/dev/null || true)
              fi
              if [ -z "$PREVIOUS_VERSION_CODE" ]; then
                B64=$(gh api "repos/$GITHUB_REPOSITORY/contents/app/build.gradle?ref=$LATEST_TAG" --jq '.content' 2>/dev/null || true)
                if [ -n "$B64" ]; then
                  PREVIOUS_VERSION_CODE=$(printf '%s' "$B64" | base64 -d 2>/dev/null | grep -m1 -E '^[[:space:]]*versionCode[[:space:]]' | grep -oE '[0-9]+' | head -1)
                fi
              fi
              echo "最新 Release $LATEST_TAG 的 versionCode=${PREVIOUS_VERSION_CODE:-未知}"
            fi
          fi
          TAG="$TAG" VERSION_NAME="$VERSION_NAME" VERSION_CODE="$VERSION_CODE" \
            PREVIOUS_VERSION_CODE="$PREVIOUS_VERSION_CODE" ./scripts/check-release.sh

      # ===== 以下仅在 tag 发布 job 内执行，secrets 只出现在本 job =====
      # 签名 4 键由前置校验强制要求（正式 tag 不允许 unsigned）；缺反代/弹弹play 凭据
      # 只会让对应功能降级，不阻断发布。
      - name: 写入构建配置（签名 + Bangumi 反代 + 弹弹play 凭据）
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASSWORD: ${{ secrets.ALIAS_PASSWORD }}
          BGM_PROXY_AUTH: ${{ secrets.BGM_PROXY_AUTH }}
          DANDAN_APP_ID: ${{ secrets.DANDAN_APP_ID }}
          DANDAN_APP_SECRET: ${{ secrets.DANDAN_APP_SECRET }}
        run: |
          # 4 键已在「发版前置校验」强制齐全；这里再防御一次，避免任何路径静默 unsigned。
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$ALIAS_NAME" ] || [ -z "$ALIAS_PASSWORD" ]; then
            echo "::error::签名 secrets 不完整，禁止进入 Release 构建"
            exit 1
          fi
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "$KEYSTORE_B64" | base64 -d > "$HOME/release.jks"
            echo "KEY_PATH=$HOME/release.jks"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
            echo "ALIAS_NAME=$ALIAS_NAME"
            echo "ALIAS_PASSWORD=$ALIAS_PASSWORD"
            # 整行写入（含 "Basic " 前缀）；Base64 只含 A-Za-z0-9+/=，不会被 Properties 解析破坏
            if [ -n "$BGM_PROXY_AUTH" ]; then
              echo "BGM_PROXY_AUTH=$BGM_PROXY_AUTH"
            fi
            # 弹弹play：纯 ASCII（AppId 短串 + 32 位 Secret），同样不受 ISO-8859-1 解析影响
            if [ -n "$DANDAN_APP_ID" ] && [ -n "$DANDAN_APP_SECRET" ]; then
              echo "DANDAN_APP_ID=$DANDAN_APP_ID"
              echo "DANDAN_APP_SECRET=$DANDAN_APP_SECRET"
            fi
          } > local.properties
          if [ -z "$BGM_PROXY_AUTH" ]; then
            echo "::warning::未配置 BGM_PROXY_AUTH，包内 Bangumi 接口只能直连 api.bgm.tv（境内大概率不可用）"
          fi
          if [ -z "$DANDAN_APP_ID" ] || [ -z "$DANDAN_APP_SECRET" ]; then
            echo "::warning::未配置 DANDAN_APP_ID / DANDAN_APP_SECRET，第三方番剧不会有弹幕"
          fi
          # 打印时抹掉敏感值，保留键名供排查
          sed -E 's/(KEY_PASSWORD|ALIAS_PASSWORD|BGM_PROXY_AUTH|DANDAN_APP_ID|DANDAN_APP_SECRET)=.*/\1=***/' local.properties

      - name: 构建 Release 包
        run: ./gradlew :app:assembleRelease --stacktrace

      # P0：正式包必须真的签名，且 APK versionCode 与构建配置一致（防止签名/版本漂移）
      - name: 校验 Release 签名与 versionCode
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          AAPT2=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt2 -type f | sort -V | tail -1)
          APK_CODE=$("$AAPT2" dump badging "$APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          EXPECTED_CODE=$(grep -m1 -E '^[[:space:]]*versionCode[[:space:]]' app/build.gradle | grep -oE '[0-9]+' | head -1)
          echo "APK versionCode=${APK_CODE}，build.gradle=$EXPECTED_CODE"
          [ -n "$APK_CODE" ] && [ "$APK_CODE" = "$EXPECTED_CODE" ] || { echo "::error::APK versionCode 与构建配置不一致"; exit 1; }

      # release 独有的资源收缩会把"只被 getIdentifier 动态引用"的资源判成不可达并裁掉
      # （历史上裁掉过 6 张教程插图），这里对最终 APK 做一次冒烟断言，防止再无声回归
      - name: release 资源冒烟（教程插图不可被裁）
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt2 -type f | sort -V | tail -1)
          N=$("$AAPT2" dump resources "$APK" | grep -cE 'mipmap/tutorial_')
          echo "release 包内教程插图数量：$N/6"
          [ "$N" -ge 6 ] || { echo "::error::release 包缺少教程插图（$N/6），检查 res/raw/keep.xml"; exit 1; }

      - name: 上传 Release 包
        uses: actions/upload-artifact@v4
        with:
          name: Re-BiliTerminal-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: 附加到 GitHub Release（不存在则自动创建）
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          if echo "$APK" | grep -q "unsigned"; then
            NAME="Re-BiliTerminal-${TAG}-release-unsigned.apk"
          else
            NAME="Re-BiliTerminal-${TAG}-release.apk"
          fi
          cp "$APK" "/tmp/$NAME"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "/tmp/$NAME" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "/tmp/$NAME" -R "$GITHUB_REPOSITORY" \
              --title "Re：哔哩终端 ${TAG}" --generate-notes
          fi

          # versionCode 以**已构建 APK** 为准（与包体强一致）；解析失败才回退 build.gradle，并显式告警
          AAPT2=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt2 -type f | sort -V | tail -1)
          VERSION_CODE=$("$AAPT2" dump badging "/tmp/$NAME" 2>/dev/null | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE=$(grep -m1 -E '^[[:space:]]*versionCode[[:space:]]' app/build.gradle | grep -oE '[0-9]+' | head -1)
            echo "::warning::无法从 APK 解析 versionCode，回退 build.gradle 值 $VERSION_CODE"
          fi
          VERSION_CODE=${VERSION_CODE:-0}
          SHA256=$(sha256sum "/tmp/$NAME" | awk '{print $1}')
          SIZE=$(stat -c%s "/tmp/$NAME")
          # 取不到原 Release 说明时直接失败：不能静默把 notes 替换成空壳
          if ! BODY=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.body' 2>/dev/null); then
            echo "::error::无法读取 Release $TAG 的说明（gh api 失败），中止更新 update.json"
            exit 1
          fi
          # 客户端 API 兜底通道从 release 说明里的元数据注释解析 versionCode/sha256：
          # 剥离旧注释后追加最新值（幂等，重复发布同一 tag 不会叠加多份）
          CLEAN_BODY=$(printf '%s' "$BODY" | sed -e 's/<!--ReBiliTerminal-update[^>]*-->//g')
          META_COMMENT="<!--ReBiliTerminal-update versionCode=${VERSION_CODE} sha256=${SHA256}-->"
          if [ -n "$CLEAN_BODY" ]; then
            NEW_BODY="${CLEAN_BODY}
          ${META_COMMENT}"
          else
            NEW_BODY="$META_COMMENT"
          fi
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes "$NEW_BODY"
          #versionCode 缺失时取 0 而不是让 tonumber 失败断掉整个发布链
          jq -n --arg versionCode "$VERSION_CODE" --arg versionName "${TAG#v}" \
                --arg sha256 "$SHA256" --arg fileName "$NAME" --argjson size "$SIZE" \
                --arg notes "$CLEAN_BODY" \
                --arg htmlUrl "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
                '{versionCode: (($versionCode | tonumber)? // 0), versionName: $versionName, sha256: $sha256, size: $size, fileName: $fileName, notes: $notes, htmlUrl: $htmlUrl}' \
            > update.json
          gh release upload "$TAG" update.json --clobber -R "$GITHUB_REPOSITORY"

  # Job E：官网部署（仅 tag）。普通 commit / PR 永不进入本 job，也不会拿到 Netlify 凭据。
  # Netlify 后台的自动构建已停止（netlify.toml 里 ignore 也兜底跳过），
  # 线上官网只在这里更新：内容取自 tag 对应的 site/ 与 netlify/functions/。
  # release 成功后才部署，避免 APK / update.json 还没就绪时官网先切到新版本。
  deploy-site:
    name: 官网部署（tag）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 部署 site/ 与 Functions 到 Netlify（生产）
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          TAG: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::缺少 NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID，官网未部署（APK 与 Release 已正常发布）"
            exit 1
          fi
          npm install --global netlify-cli@17.38.1 >/dev/null
          # 纯静态站不需要 Netlify 侧构建：只上传静态文件 + Functions（CLI 默认不跑构建）。
          # _redirects（/api/update.json → function）随 site/ 一起生效。
          netlify deploy \
            --prod \
            --dir=site \
            --functions=netlify/functions \
            --message "release ${TAG}"
