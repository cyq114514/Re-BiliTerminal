name: CI

# 触发面：
#   - push main：规范检查 + Debug 编译 + JVM 单元测试（不发版）
#   - pull_request → main：同上；纯文档变更跳过（paths-ignore）
#   - push tag v*：额外进入 release job（与日常测试 job 职责分离，发布链行为不变）
#   - workflow_dispatch：手动跑完整 CI（tag ref 时仍走发布链）
#
# 权限最小化：workflow 默认只读；发布需要的 contents: write 只挂在 tag 专用的 release job 上。
# 普通 PR/main push 不接触任何 secrets，也不执行 Release 发布。

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
    # PR 只跳过纯文档变更；push/tag 不加 paths 过滤，避免影响发版判断
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # tag 发布不取消，避免两条发布链互相覆盖；分支/PR 连推时取消旧任务
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Job A：仓库规范 + 测试体系不变量 + CI 配置静态检查。
  # 不编译，因此几分钟内就能拦住文档链接失效、凭据误入库、Audio Focus 设计被破坏等问题。
  checks:
    name: 规范与环境检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17（含 Gradle 缓存）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: 准备 Android SDK（环境检查需要 ANDROID_HOME/platform 33）
        run: ./scripts/ci-prepare-sdk.sh

      - name: 环境与仓库自检（6 个只读脚本）
        run: |
          set -o pipefail
          ./scripts/check-env.sh
          ./scripts/check-repo.sh
          ./scripts/check-links.sh
          ./scripts/validate-ci.sh
          ./scripts/check-tests.sh

  # Job B：Debug 编译。编译失败必须让 job 失败；产物与日志用于定位。
  build:
    name: 编译自检（Debug）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17（含 Gradle 缓存）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: 准备 Android SDK（platform 33 / build-tools）
        run: ./scripts/ci-prepare-sdk.sh

      # 此时没有任何 secrets：debug 包不含凭据（发布 job 才注入）
      - name: 编译自检（Debug 包）
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: 上传 Debug 包
        uses: actions/upload-artifact@v4
        with:
          name: Re-BiliTerminal-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  # Job C：JVM 单元测试（JUnit4 + Robolectric，无需模拟器）。
  # 与 build 并行：编译失败与测试失败在界面上是两条独立结果，便于区分原因。
  unit-test:
    name: JVM 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17（含 Gradle 缓存）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: 准备 Android SDK（platform 33 / build-tools）
        run: ./scripts/ci-prepare-sdk.sh

      # Gradle 的退出码决定 job 成败：测试失败/编译失败都会让本 job 红。
      # 不加 continue-on-error，避免把核心测试失败伪装成通过。
      - name: 执行 JVM 单元测试
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # 报告步骤始终执行：即使 Gradle 失败也要把「哪些用例失败/为什么」放进日志与 Summary。
      # 没有 TEST-*.xml 时脚本以退出码 2 明确标记 NOT RUN（编译/环境问题）。
      - name: 汇总测试结果（日志 + GitHub Step Summary）
        if: always()
        run: python3 scripts/summarize-tests.py app/build/test-results/testDebugUnitTest

      - name: 上传测试报告（XML + HTML）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  # Job D（Android Emulator 集成测试）有意不纳入默认门禁，原因见 docs/development/ci.md：
  # 现有仪器化测试会真实联网并向线上 Supabase 写数据，且 ijkplayer/native 依赖在模拟器上不稳定，
  # 满足不了「不随机失败」的要求。评估结论与后续接入条件记录在文档里，不在这里放"看起来完整"的空 job。

  release:
    name: 发布（tag）
    # 只有 tag 推送才进入发布链；普通 PR / main push 永远不会拿到写权限与 secrets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17（含 Gradle 缓存）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: 准备 Android SDK（platform 33 / build-tools）
        run: ./scripts/ci-prepare-sdk.sh

      # 新 tag 建议统一为 v<versionName>；历史 -fix/fix1 命名只告警、不阻断发布
      - name: 校验 tag 与 versionName 一致
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          GRADLE_VERSION=$(grep -m1 -E '^[[:space:]]*versionName[[:space:]]' app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$GITHUB_REF_NAME  versionName=$GRADLE_VERSION"
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "::warning::tag（$GITHUB_REF_NAME）与 versionName（$GRADLE_VERSION）不一致；新 tag 建议统一为 v<versionName>，发布继续。"
          fi

      # ===== 以下仅在 tag 发布 job 内执行，secrets 只出现在本 job =====
      # 三组 secret 各自独立：缺签名密钥 → 出未签名包；缺反代凭据 → Bangumi 只能直连；
      # 缺弹弹play 凭据 → 第三方番剧没有弹幕（其余功能不受影响）。
      - name: 写入构建配置（签名 + Bangumi 反代 + 弹弹play 凭据）
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASSWORD: ${{ secrets.ALIAS_PASSWORD }}
          BGM_PROXY_AUTH: ${{ secrets.BGM_PROXY_AUTH }}
          DANDAN_APP_ID: ${{ secrets.DANDAN_APP_ID }}
          DANDAN_APP_SECRET: ${{ secrets.DANDAN_APP_SECRET }}
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            # 签名 4 键"全有或全无"：任一缺失都按未签名处理，避免"看起来签了名其实失败"
            if [ -n "$KEYSTORE_B64" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$ALIAS_NAME" ] && [ -n "$ALIAS_PASSWORD" ]; then
              echo "$KEYSTORE_B64" | base64 -d > "$HOME/release.jks"
              echo "KEY_PATH=$HOME/release.jks"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
              echo "ALIAS_NAME=$ALIAS_NAME"
              echo "ALIAS_PASSWORD=$ALIAS_PASSWORD"
            else
              if [ -n "$KEYSTORE_B64" ]; then
                echo "::warning::签名配置不完整（KEYSTORE_B64 存在但 4 键未齐），本次按未签名构建"
              fi
            fi
            # 整行写入（含 "Basic " 前缀）；Base64 只含 A-Za-z0-9+/=，不会被 Properties 解析破坏
            if [ -n "$BGM_PROXY_AUTH" ]; then
              echo "BGM_PROXY_AUTH=$BGM_PROXY_AUTH"
            fi
            # 弹弹play：纯 ASCII（AppId 短串 + 32 位 Secret），同样不受 ISO-8859-1 解析影响
            if [ -n "$DANDAN_APP_ID" ] && [ -n "$DANDAN_APP_SECRET" ]; then
              echo "DANDAN_APP_ID=$DANDAN_APP_ID"
              echo "DANDAN_APP_SECRET=$DANDAN_APP_SECRET"
            fi
          } > local.properties
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::未配置 KEYSTORE_B64 等 secrets，本次 Release 包不做正式签名"
          fi
          if [ -z "$BGM_PROXY_AUTH" ]; then
            echo "::warning::未配置 BGM_PROXY_AUTH，包内 Bangumi 接口只能直连 api.bgm.tv（境内大概率不可用）"
          fi
          if [ -z "$DANDAN_APP_ID" ] || [ -z "$DANDAN_APP_SECRET" ]; then
            echo "::warning::未配置 DANDAN_APP_ID / DANDAN_APP_SECRET，第三方番剧不会有弹幕"
          fi
          # 打印时抹掉敏感值，保留键名供排查
          sed -E 's/(KEY_PASSWORD|ALIAS_PASSWORD|BGM_PROXY_AUTH|DANDAN_APP_ID|DANDAN_APP_SECRET)=.*/\1=***/' local.properties

      - name: 构建 Release 包
        run: ./gradlew :app:assembleRelease --stacktrace

      # release 独有的资源收缩会把"只被 getIdentifier 动态引用"的资源判成不可达并裁掉
      # （历史上裁掉过 6 张教程插图），这里对最终 APK 做一次冒烟断言，防止再无声回归
      - name: release 资源冒烟（教程插图不可被裁）
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt2 -type f | sort -V | tail -1)
          N=$("$AAPT2" dump resources "$APK" | grep -cE 'mipmap/tutorial_')
          echo "release 包内教程插图数量：$N/6"
          [ "$N" -ge 6 ] || { echo "::error::release 包缺少教程插图（$N/6），检查 res/raw/keep.xml"; exit 1; }

      - name: 上传 Release 包
        uses: actions/upload-artifact@v4
        with:
          name: Re-BiliTerminal-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: 附加到 GitHub Release（不存在则自动创建）
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          if echo "$APK" | grep -q "unsigned"; then
            NAME="Re-BiliTerminal-${TAG}-release-unsigned.apk"
          else
            NAME="Re-BiliTerminal-${TAG}-release.apk"
          fi
          cp "$APK" "/tmp/$NAME"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "/tmp/$NAME" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "/tmp/$NAME" -R "$GITHUB_REPOSITORY" \
              --title "Re：哔哩终端 ${TAG}" --generate-notes
          fi

          # versionCode 以**已构建 APK** 为准（与包体强一致）；解析失败才回退 build.gradle，并显式告警
          AAPT2=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt2 -type f | sort -V | tail -1)
          VERSION_CODE=$("$AAPT2" dump badging "/tmp/$NAME" 2>/dev/null | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE=$(grep -m1 -E '^[[:space:]]*versionCode[[:space:]]' app/build.gradle | grep -oE '[0-9]+' | head -1)
            echo "::warning::无法从 APK 解析 versionCode，回退 build.gradle 值 $VERSION_CODE"
          fi
          VERSION_CODE=${VERSION_CODE:-0}
          SHA256=$(sha256sum "/tmp/$NAME" | awk '{print $1}')
          SIZE=$(stat -c%s "/tmp/$NAME")
          # 取不到原 Release 说明时直接失败：不能静默把 notes 替换成空壳
          if ! BODY=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.body' 2>/dev/null); then
            echo "::error::无法读取 Release $TAG 的说明（gh api 失败），中止更新 update.json"
            exit 1
          fi
          # 客户端 API 兜底通道从 release 说明里的元数据注释解析 versionCode/sha256：
          # 剥离旧注释后追加最新值（幂等，重复发布同一 tag 不会叠加多份）
          CLEAN_BODY=$(printf '%s' "$BODY" | sed -e 's/<!--ReBiliTerminal-update[^>]*-->//g')
          META_COMMENT="<!--ReBiliTerminal-update versionCode=${VERSION_CODE} sha256=${SHA256}-->"
          if [ -n "$CLEAN_BODY" ]; then
            NEW_BODY="${CLEAN_BODY}
          ${META_COMMENT}"
          else
            NEW_BODY="$META_COMMENT"
          fi
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes "$NEW_BODY"
          #versionCode 缺失时取 0 而不是让 tonumber 失败断掉整个发布链
          jq -n --arg versionCode "$VERSION_CODE" --arg versionName "${TAG#v}" \
                --arg sha256 "$SHA256" --arg fileName "$NAME" --argjson size "$SIZE" \
                --arg notes "$CLEAN_BODY" \
                --arg htmlUrl "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
                '{versionCode: (($versionCode | tonumber)? // 0), versionName: $versionName, sha256: $sha256, size: $size, fileName: $fileName, notes: $notes, htmlUrl: $htmlUrl}' \
            > update.json
          gh release upload "$TAG" update.json --clobber -R "$GITHUB_REPOSITORY"
