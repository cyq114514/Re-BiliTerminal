name: 功能建议
description: 想要的新功能或改进
labels: [ enhancement ]
body:
  - type: textarea
    id: describe
    attributes:
      label: 想要什么功能
      description: 说明使用场景，越具体越容易被采纳
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: 参考对象（可选）
      description: 例如 B 站官方客户端、PiliPlus 等的对应做法
