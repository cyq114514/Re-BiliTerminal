name: 问题反馈
description: 功能异常、闪退、显示错误等
labels: [ bug ]
body:
  - type: dropdown
    id: version
    attributes:
      label: 应用版本
      description: 关于应用页可查看版本名
      options:
        - 1.1.0
        - 1.0.2-fix1
        - 更早版本（请说明）
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与系统版本
      description: 例如：小米手表 / Android 8.1；或手机型号 / Android 版本
      placeholder: 设备型号 + Android 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 怎样操作会触发这个问题
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expect
    attributes:
      label: 期望表现与实际表现
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 截图 / 日志（可选）
      description: 截图或开发者选项中的日志片段，可拖拽上传
