plugins {
    id 'com.android.application'
}

int betaVer = 0 //如果为0则是正式版

android {

    namespace 'com.RobinNotBad.BiliClient'
    //noinspection GradleDependency
    compileSdk 33

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main{
            jniLibs.srcDirs = ['libs']
            java {
                exclude '**/GeetestUtil.java'
            }
        }
    }

    defaultConfig {
        //作为独立分支使用的新包名，与上游哔哩终端互不覆盖、可共存
        applicationId "com.RobinNotBad.BiliClient.re"
        minSdk 19
        //noinspection ExpiredTargetSdkVersion
        targetSdk 26
        versionCode 20261009
        versionName "1.2.0"

        if (betaVer) {
            versionName += "-BETA" + betaVer
        }

        multiDexEnabled true

        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters 'armeabi-v7a','x86'
        }

        resConfigs 'zh'
    }

    signingConfigs {
        release {
            def localPropsFile = project.rootProject.file("local.properties")
            if (localPropsFile.exists()) {
                def props = new Properties()
                props.load(localPropsFile.newDataInputStream())
                //必须用 containsKey：hasProperty 查的是 Groovy 对象属性而非 Properties 的键，会误返回 false 导致 storeFile 不设置
                if (props.containsKey("KEY_PATH")) {
                    storeFile file(props.getProperty("KEY_PATH"))
                    storePassword props.getProperty("KEY_PASSWORD")
                    keyAlias props.getProperty("ALIAS_NAME")
                    keyPassword props.getProperty("ALIAS_PASSWORD")
                }
            }
        }
    }

    buildTypes {
        release {
            buildConfigField "boolean", "BETA", String.valueOf(betaVer > 0)
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def localPropsFile = project.rootProject.file("local.properties")
            if (localPropsFile.exists()) {
                def props = new Properties()
                props.load(localPropsFile.newDataInputStream())
                //必须用 containsKey：hasProperty 查的是 Groovy 对象属性而非 Properties 的键，会误返回 false 导致 release 不签名
                if (props.containsKey("KEY_PATH")) {
                    signingConfig signingConfigs.release
                }
            }
        }
        debug {
            buildConfigField "boolean", "BETA", String.valueOf(betaVer > 0)
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        exclude 'META-INF/androidx.cardview_cardview.version'
    }
    buildFeatures {
        viewBinding false
    }
}

dependencies {
    //noinspection GradleDependency
    implementation 'com.google.zxing:core:3.3.0'
    //noinspection GradleDependency
    implementation 'androidx.appcompat:appcompat:1.5.1'
    //noinspection GradleDependency
    implementation 'com.google.android.material:material:1.9.0'
    //noinspection GradleDependency
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.github.bumptech.glide:glide:4.13.2'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.13.2'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.13.2'
    //noinspection GradleDependency
    implementation 'org.jsoup:jsoup:1.15.3'
    //noinspection GradleCompatible
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation 'org.greenrobot:eventbus:3.2.0'
    // Geetest（目前没用到）
    //implementation 'com.geetest.sensebot:sensebot:4.4.2.1'
    //danmaku
    //implementation 'com.github.ctiao:DanmakuFlameMaster:0.9.25'
    //implementation 'com.github.ctiao:ndkbitmap-armv7a:0.9.21'
    //implementation 'com.github.ctiao:ndkbitmap-x86:0.9.21'
    //ijk
    implementation project(path: ':ijkplayer-java')
    implementation project(path: ':DanmakuFlameMaster')
    implementation project(path: ':brotlij')
    implementation 'androidx.asynclayoutinflater:asynclayoutinflater:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    def multidex_version = "2.0.1"
    implementation "androidx.multidex:multidex:$multidex_version"
    //brotli 实际使用的是 brotlij 模块的 JNI 实现（com.netease.hearttouch.brotlij.Brotli）；
    //此前的 org.brotli:dec 与 brotli4j 为 0 引用死依赖，已移除
    implementation 'com.google.protobuf:protobuf-javalite:3.21.12'
    implementation 'com.google.code.gson:gson:2.8.9'
}
