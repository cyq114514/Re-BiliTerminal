plugins {
    id 'com.android.application'
}

int betaVer = 0 //如果为0则是正式版

android {

    namespace 'com.RobinNotBad.BiliClient'
    //noinspection GradleDependency
    compileSdk 33

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main{
            jniLibs.srcDirs = ['libs']
            java {
                exclude '**/GeetestUtil.java'
            }
        }
    }

    defaultConfig {
        //作为独立分支使用的新包名，与上游哔哩终端互不覆盖、可共存
        applicationId "com.RobinNotBad.BiliClient.re"
        minSdk 19
        //noinspection ExpiredTargetSdkVersion
        targetSdk 26
        versionCode 20261118
        versionName "1.3.7"

        if (betaVer) {
            versionName += "-BETA" + betaVer
        }

        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            //noinspection ChromeOsAbiSupport
            //release 只留 armeabi-v7a：真实老设备全是 v7a。x86 仅为模拟器保留，挪到 debug 变体——
            //砍掉 release 的 x86（原始 7.7MB .so）抵消 Conscrypt v7a 的增量，净体积下降
            abiFilters 'armeabi-v7a'
        }

        resConfigs 'zh'

        //第三方弹幕（弹弹play）凭据：只从 local.properties 读，不入库。
        //缺失时功能自动关闭（第 3 方播放照常，只是没有弹幕）。
        def danmakuProps = new Properties()
        def danmakuPropsFile = project.rootProject.file("local.properties")
        if (danmakuPropsFile.exists()) {
            danmakuProps.load(danmakuPropsFile.newDataInputStream())
        }
        def dandanAppId = danmakuProps.getProperty("DANDAN_APP_ID", "")
        def dandanSecret = danmakuProps.getProperty("DANDAN_APP_SECRET", "")
        buildConfigField "String", "DANDAN_APP_ID", "\"${dandanAppId}\""
        buildConfigField "String", "DANDAN_APP_SECRET", "\"${dandanSecret}\""

        //Bangumi 反代（Basic 鉴权）凭据：同样只从 local.properties 读，不入库；
        //CI 在 tag 发版时由仓库 secret BGM_PROXY_AUTH 注入。
        //值为完整请求头（含 "Basic " 前缀）、纯 ASCII，Properties.load 按 ISO-8859-1 解析不会坏。
        //缺失时反代不进候选，客户端自动退回 api.bgm.tv 直连（境外可用，境内大概率连不上）。
        def bgmProxyAuth = danmakuProps.getProperty("BGM_PROXY_AUTH", "").trim()
        buildConfigField "String", "BGM_PROXY_AUTH", "\"${bgmProxyAuth}\""
    }

    signingConfigs {
        release {
            def localPropsFile = project.rootProject.file("local.properties")
            if (localPropsFile.exists()) {
                def props = new Properties()
                props.load(localPropsFile.newDataInputStream())
                //必须用 containsKey：hasProperty 查的是 Groovy 对象属性而非 Properties 的键，会误返回 false 导致 storeFile 不设置
                if (props.containsKey("KEY_PATH")) {
                    storeFile file(props.getProperty("KEY_PATH"))
                    storePassword props.getProperty("KEY_PASSWORD")
                    keyAlias props.getProperty("ALIAS_NAME")
                    keyPassword props.getProperty("ALIAS_PASSWORD")
                }
            }
        }
    }

    buildTypes {
        release {
            buildConfigField "boolean", "BETA", String.valueOf(betaVer > 0)
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def localPropsFile = project.rootProject.file("local.properties")
            if (localPropsFile.exists()) {
                def props = new Properties()
                props.load(localPropsFile.newDataInputStream())
                //必须用 containsKey：hasProperty 查的是 Groovy 对象属性而非 Properties 的键，会误返回 false 导致 release 不签名
                if (props.containsKey("KEY_PATH")) {
                    signingConfig signingConfigs.release
                }
            }
        }
        debug {
            buildConfigField "boolean", "BETA", String.valueOf(betaVer > 0)
            signingConfig signingConfigs.debug
            ndk {
                //模拟器（x86 镜像）装调试包用；release 不带 x86（见 defaultConfig 注释）。
                //-PemuArm64 追加 arm64-v8a：Apple Silicon 模拟器（只有 arm64 镜像）跑仪器化测试用——
                //ijkplayer 等无 arm64 预编译库，此模式下播放相关功能会崩，仅用于 TLS 验证
                abiFilters(*(['armeabi-v7a', 'x86'] + (project.hasProperty('emuArm64') ? ['arm64-v8a'] : [])))
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        exclude 'META-INF/androidx.cardview_cardview.version'
    }
    buildFeatures {
        viewBinding false
    }
}

dependencies {
    //noinspection GradleDependency
    implementation 'com.google.zxing:core:3.3.0'
    //noinspection GradleDependency
    implementation 'androidx.appcompat:appcompat:1.5.1'
    //noinspection GradleDependency
    implementation 'com.google.android.material:material:1.9.0'
    //noinspection GradleDependency
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    //老设备（API≤22）崩溃上报通道的 TLS 回移：内嵌 BoringSSL（Conscrypt）补 TLS1.2 AEAD/1.3。
    //版本锁死 2.5.2：2.6.x 起改用 NDK 27 构建，放弃 Android 4.x（API 19/20）。
    //依据与证据见 docs/decisions-tls-backport.md
    //noinspection GradleDependency
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.github.bumptech.glide:glide:4.13.2'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.13.2'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.13.2'
    //noinspection GradleDependency
    implementation 'org.jsoup:jsoup:1.15.3'
    //noinspection GradleCompatible
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation 'org.greenrobot:eventbus:3.2.0'
    // Geetest（目前没用到）
    //implementation 'com.geetest.sensebot:sensebot:4.4.2.1'
    //danmaku
    //implementation 'com.github.ctiao:DanmakuFlameMaster:0.9.25'
    //implementation 'com.github.ctiao:ndkbitmap-armv7a:0.9.21'
    //implementation 'com.github.ctiao:ndkbitmap-x86:0.9.21'
    //ijk
    implementation project(path: ':ijkplayer-java')
    implementation project(path: ':DanmakuFlameMaster')
    implementation project(path: ':brotlij')
    implementation 'androidx.asynclayoutinflater:asynclayoutinflater:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    def multidex_version = "2.0.1"
    implementation "androidx.multidex:multidex:$multidex_version"
    //brotli 实际使用的是 brotlij 模块的 JNI 实现（com.netease.hearttouch.brotlij.Brotli）；
    //此前的 org.brotli:dec 与 brotli4j 为 0 引用死依赖，已移除
    implementation 'com.google.protobuf:protobuf-javalite:3.21.12'
    implementation 'com.google.code.gson:gson:2.8.9'
    //TLS 回移的仪器化验证（Apple Silicon 上唯一可行的模拟器验证通道，见 androidTest/TlsBackportInstrumentedTest）
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:core:1.5.0'
    //崩溃上报已改为自建服务（Supabase REST + OkHttp），不再依赖任何闭源 SDK
}
